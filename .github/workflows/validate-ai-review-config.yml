name: Validate Argus review config

# The Argus review workflow runs on `pull_request_target`, so a mistake in it
# is only observable after it merges — and before issue #41 a crashed review
# still reported success. This check runs on the untrusted `pull_request`
# event (no secrets, no write token) and asserts the invariants that keep a
# silent no-review from looking like a pass.

# Deliberately unfiltered by `paths`: a path-filtered job never reports on
# PRs that do not touch those files, which makes it unusable as a required
# status check. It runs in a couple of seconds.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: ai-review.yml invariants
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/check-ai-review-workflow.cjs
