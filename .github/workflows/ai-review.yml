name: AI PR Review (Argus)

# Argus is an LLM PR reviewer that posts an `--approve`, `--comment`, or
# `--request-changes` review on every non-dependabot PR. It reads the diff,
# delegates to subagents when relevant (ad-tech-protocol-expert,
# security-reviewer, code-reviewer, etc.), and writes the review in
# bokelley's voice.
#
# Reviews are posted with the IPR GitHub App installation token so fork PRs can
# be reviewed and the resulting bot review is attributable to the same App that
# owns this repo's IPR workflow.
#
# Required secrets:
#   IPR_APP_ID           — already configured for the IPR workflow
#   IPR_APP_PRIVATE_KEY  — already configured for the IPR workflow
#   ANTHROPIC_API_KEY  — Anthropic API key for claude-code-action
#
# Adapted from adcontextprotocol/adcp's Argus workflow.

on:
  pull_request_target:
    types:
      - opened
      - labeled
      - ready_for_review
      - synchronize

jobs:
  code_review:
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      # This workflow uses pull_request_target so fork PRs can be reviewed.
      # Never check out the PR head or execute PR-controlled code in this job.
      # Keep the workspace pinned to the trusted base SHA and inspect the PR
      # through GitHub APIs / gh pr diff.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record run start
        shell: bash
        run: echo "ARGUS_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────────────────────────────
      # Self-modification gate. If the PR's cumulative diff touches Argus's
      # own configuration (`.github/workflows/ai-review.yml` or any file
      # under `.github/ai-review/**`), skip Argus entirely and post a
      # notice that a human reviewer is required.
      # ─────────────────────────────────────────────────────────────────────
      - name: Self-modification check
        id: self-mod
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DIFF_FILES="$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)"
          TOUCHED="$(printf '%s\n' "$DIFF_FILES" \
            | grep -E '^(\.github/workflows/ai-review\.yml|\.github/ai-review/)' || true)"
          if [ -n "$TOUCHED" ]; then
            echo "touches=true" >> "$GITHUB_OUTPUT"
            echo "Argus paths touched — pausing Argus on this PR. Files:"
            echo "$TOUCHED"
          else
            echo "touches=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint App token for paused notice
        if: steps.self-mod.outputs.touches == 'true'
        id: notice-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.IPR_APP_ID }}
          private-key: ${{ secrets.IPR_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write

      - name: Post Argus-paused notice
        if: steps.self-mod.outputs.touches == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ steps.notice-token.outputs.token }}
          script: |
            const marker = '<!-- argus-self-mod-notice -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            if (comments.some(c => c.body && c.body.includes(marker))) {
              core.info('Notice already posted on this PR — skipping.');
              return;
            }
            const runUrl = process.env.RUN_URL;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${marker}\n🛑 **Argus paused on this PR.**\n\nThis PR modifies Argus's own configuration (\`.github/workflows/ai-review.yml\` or \`.github/ai-review/**\`). Argus will not post an approving review on changes to its own gates — a human reviewer must take this PR.\n\n[Workflow run](${runUrl})\n\n<sub>Automated by the Argus self-modification gate.</sub>`,
            });

      - name: Snapshot PR for Argus
        if: steps.self-mod.outputs.touches != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .argus
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json title,body,labels,files,additions,deletions,changedFiles,baseRefName,headRefName \
            > .argus/pr-view.json
          gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only > .argus/files.txt
          gh pr diff "$PR_NUMBER" --repo "$REPO" > .argus/pr.diff

      - name: Build Argus review prompt
        if: steps.self-mod.outputs.touches != 'true'
        id: build-prompt
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE_SHA}:.github/ai-review/expert-adcp-reviewer.md" 2>/dev/null; then
            echo "::error::Prompt file does not exist at base SHA ${BASE_SHA}. Self-modification gate should have caught this."
            exit 1
          fi
          PROMPT_BODY="$(git show "${BASE_SHA}:.github/ai-review/expert-adcp-reviewer.md" \
            | sed '/^This is a real review on a real PR\./,/^$/d' \
            | awk '/^## Picking the action$/ { exit } { print }')"
          SENTINEL="ARGUS_$(openssl rand -hex 8)_EOF"
          {
            echo "ARGUS_PROMPT<<${SENTINEL}"
            echo "$PROMPT_BODY"
            echo ''
            echo '---'
            echo ''
            echo '## Pre-computed inputs for this PR'
            echo ''
            echo "- PR_NUMBER: $PR_NUMBER"
            echo "- REPO: $REPO"
            echo "- PR_BASE_REF: $PR_BASE_REF"
            echo "- PR_VIEW_FILE: .argus/pr-view.json"
            echo "- PR_FILES_FILE: .argus/files.txt"
            echo "- PR_DIFF_FILE: .argus/pr.diff"
            echo ''
            echo '## Workflow execution override'
            echo ''
            echo 'This workflow runs Claude in read-only analysis mode for pull_request_target safety.'
            echo 'Do not post a review yourself, do not call `gh pr review`, and do not use Bash.'
            echo 'Use the precomputed `.argus/*` files for PR metadata, changed files, and diff content.'
            echo 'Return only structured JSON matching the configured schema:'
            echo '- `event`: one of `APPROVE`, `COMMENT`, or `REQUEST_CHANGES`.'
            echo '- `body`: the complete Markdown review body.'
            echo ''
            echo 'Choose `REQUEST_CHANGES` only for the prompt-defined MUST FIX issues.'
            echo 'Choose `COMMENT` when a human-hold label or unresolved question prevents approval.'
            echo 'Choose `APPROVE` for a clean review.'
            echo ''
            echo 'A trusted workflow step will validate that JSON and post the review with the GitHub App token.'
            echo "${SENTINEL}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Argus PR Review
        id: ai-review
        if: steps.self-mod.outputs.touches != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1
        with:
          prompt: ${{ steps.build-prompt.outputs.ARGUS_PROMPT }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          settings: |
            {
              "permissions": {
                "deny": ["Bash"]
              },
              "sandbox": {
                "enabled": true,
                "allowUnsandboxedCommands": false,
                "filesystem": {
                  "denyRead": ["/"],
                  "allowRead": ["."]
                }
              }
            }
          use_sticky_comment: false
          track_progress: false
          claude_args: |
            --permission-mode dontAsk
            --allowedTools "Read,Glob,Grep,Task"
            --disallowedTools "Bash,Edit,Replace,NotebookEditCell,Write,MultiEdit"
            --max-turns 60
            --model claude-opus-4-7
            --output-format json
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"event":{"type":"string","enum":["APPROVE","COMMENT","REQUEST_CHANGES"]},"body":{"type":"string","minLength":1,"maxLength":60000}},"required":["event","body"]}'

      # Mint the write-capable App token only after Claude has finished. Claude
      # receives the read-scoped GITHUB_TOKEN above; this fixed step posts the
      # validated structured output.
      - name: Mint App token for review posting
        id: review-token
        if: always() && steps.self-mod.outputs.touches != 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.IPR_APP_ID }}
          private-key: ${{ secrets.IPR_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Post Argus review
        id: post-review
        if: steps.self-mod.outputs.touches != 'true' && steps.ai-review.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_JSON: ${{ steps.ai-review.outputs.structured_output }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ steps.review-token.outputs.token }}
          script: |
            const raw = process.env.REVIEW_JSON || '';
            let review;
            try {
              review = JSON.parse(raw);
            } catch (error) {
              throw new Error(`Argus returned invalid structured output: ${error.message}`);
            }

            const allowedEvents = new Set(['APPROVE', 'COMMENT', 'REQUEST_CHANGES']);
            if (!allowedEvents.has(review.event)) {
              throw new Error(`Invalid review event: ${review.event}`);
            }
            if (typeof review.body !== 'string' || review.body.trim().length === 0) {
              throw new Error('Review body is empty.');
            }
            if (review.body.length > 60000) {
              throw new Error(`Review body is too large: ${review.body.length} characters.`);
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              commit_id: process.env.HEAD_SHA,
              event: review.event,
              body: review.body,
            });

      - name: Verify Argus posted a review
        id: verify
        if: always() && steps.review-token.outcome == 'success' && steps.self-mod.outputs.touches != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.review-token.outputs.app-slug }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          LATEST="$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            | jq --arg login "${APP_SLUG}[bot]" --arg sha "$HEAD_SHA" --arg start "$ARGUS_RUN_STARTED_AT" \
              '[.[] | select(.user.login == $login and .commit_id == $sha and .submitted_at >= $start)] | sort_by(.submitted_at) | last // {}')"
          STATE="$(echo "$LATEST" | jq -r '.state // ""')"
          AUTHOR="$(echo "$LATEST" | jq -r '.user.login // ""')"
          SUBMITTED="$(echo "$LATEST" | jq -r '.submitted_at // ""')"
          COMMIT="$(echo "$LATEST" | jq -r '.commit_id // ""')"
          echo "Latest review by ${APP_SLUG}[bot] on ${HEAD_SHA:0:12} since $ARGUS_RUN_STARTED_AT — author: $AUTHOR, state: $STATE, submitted: $SUBMITTED, commit: ${COMMIT:0:12}"
          if [ -z "$STATE" ]; then
            echo "review_posted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No review from ${APP_SLUG}[bot] found on PR #${PR_NUMBER} at ${HEAD_SHA:0:12} for this run"
            exit 0
          fi
          echo "review_posted=true" >> "$GITHUB_OUTPUT"
          echo "review_state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Comment on PR if Argus review failed
        if: steps.self-mod.outputs.touches != 'true' && steps.review-token.outcome == 'success' && (steps.ai-review.outcome == 'failure' || steps.post-review.outcome == 'failure' || steps.verify.outputs.review_posted != 'true')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ steps.review-token.outputs.token }}
          script: |
            const runUrl = process.env.RUN_URL;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **Argus review could not complete**\n\nThe automated review encountered an issue (possibly reached max turns, timed out, or failed to post the final \`gh pr review\`). A human reviewer should take this PR.\n\n[View workflow run](${runUrl})\n\n<sub>This is an automated message from the Argus AI review workflow.</sub>`
            });
